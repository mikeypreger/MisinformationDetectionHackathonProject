[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python -m spacy download en_core_web_sm && cd frontend && npm install && npm run build"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
